<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宿舍空气质量监测台</title>
  <style>
    :root{--ink:#17324d;--muted:#65758b;--teal:#1d8a78;--teal-soft:#d9f0ea;--orange:#e9983d;--red:#d75a5a;--blue:#3d78b2;--line:#d9e2ec;--bg:#f4f8fa;--card:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}
    header{background:var(--ink);color:#fff;padding:1.2rem max(1rem,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:1rem}
    header h1{font-size:1.25rem;margin:0}header p{font-size:.82rem;margin:.25rem 0 0;color:#b9c9d5}
    main{max-width:1180px;margin:0 auto;padding:1.3rem 1rem 2.5rem}.toolbar,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #17324d0b}
    .toolbar{padding:.8rem;display:flex;flex-wrap:wrap;gap:.65rem;align-items:center;margin-bottom:1rem}.toolbar label{font-size:.85rem;color:var(--muted)}
    select,input,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem;background:#fff;color:var(--ink)}button{cursor:pointer;background:var(--teal);color:#fff;border-color:var(--teal)}button.secondary{background:#fff;color:var(--ink)}button.danger{background:#fff;color:var(--red);border-color:#f0b5b5}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}.card{padding:1rem}.card h2,.card h3{margin:.1rem 0 .7rem}.card h2{font-size:1rem}.card h3{font-size:1rem}
    .metric{font-size:2rem;font-weight:800;color:var(--teal)}.meta{color:var(--muted);font-size:.86rem;line-height:1.7}.status{border-radius:999px;padding:.25rem .55rem;font-size:.78rem;background:var(--teal-soft);color:var(--teal)}.status.offline{background:#fbe3e3;color:var(--red)}
    .section{margin-top:1rem}.section-title{display:flex;justify-content:space-between;align-items:center;gap:1rem}.section-title h2{font-size:1.05rem}
    canvas{width:100%;height:280px;background:#fff;border:1px solid var(--line);border-radius:10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:.62rem;border-bottom:1px solid #e8eef3;font-size:.86rem}th{color:var(--muted);font-weight:600}
    .alarm-high{color:var(--red);font-weight:700}.alarm-mid{color:var(--orange);font-weight:700}.empty{color:var(--muted);padding:.8rem 0}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}.form-grid label{display:flex;flex-direction:column;gap:.25rem;color:var(--muted);font-size:.78rem}.notice{font-size:.82rem;color:var(--muted);margin:.65rem 0 0}
    @media(max-width:600px){header{display:block}.toolbar>*{width:100%}.toolbar button{width:auto}}
  </style>
</head>
<body>
<header><div><h1>宿舍空气质量监测台</h1><p>本地优先 · MQTT可选 · 数据可解释</p></div><span id="health" class="status">连接中</span></header>
<main>
  <section class="toolbar">
    <label>设备 <select id="device"><option value="">全部设备</option></select></label>
    <label>趋势指标 <select id="metric"><option value="aq_index">空气指数</option><option value="temp">温度</option><option value="humi">湿度</option><option value="aq_raw">原始ADC</option><option value="lux">光照</option></select></label>
    <label>聚合 <select id="bucket"><option value="1m">1分钟</option><option value="1h">1小时</option><option value="raw">原始</option></select></label>
    <button id="refresh">刷新数据</button><button id="toggleSettings" class="secondary">阈值设置</button>
  </section>
  <section id="cards" class="grid"></section>
  <section class="card section"><div class="section-title"><h2>趋势图</h2><span id="chartLabel" class="meta">请选择设备</span></div><canvas id="chart" width="1100" height="280"></canvas></section>
  <section id="settings" class="card section" hidden><div class="section-title"><h2>阈值设置</h2><button id="saveThreshold">保存阈值</button></div><div class="form-grid">
    <label>指标<select id="thresholdMetric"><option value="temp">温度</option><option value="humi">湿度</option><option value="aq_index">空气指数</option></select></label>
    <label>预警上限<input id="warnHi" type="number" step="0.1"></label><label>告警上限<input id="alertHi" type="number" step="0.1"></label>
  </div><p class="notice">阈值用于后端告警落库；实际值应结合宿舍基线校准。低于下限的告警可通过API配置。</p></section>
  <section class="card section"><div class="section-title"><h2>最近告警</h2><button id="refreshAlarms" class="secondary">刷新</button></div><div id="alarms" class="empty">暂无告警</div></section>
  <section class="card section"><div class="section-title"><h2>设备状态</h2><span class="meta">超过90秒未上报将显示离线</span></div><div class="table-wrap"><table><thead><tr><th>设备</th><th>房间</th><th>在线</th><th>最后上报</th></tr></thead><tbody id="devices"></tbody></table></div></section>
</main>
<script>
  const api=`${location.protocol}//${location.hostname}:8000`, $=id=>document.getElementById(id);
  const esc=v=>String(v??'--').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function get(path){const r=await fetch(api+path);if(!r.ok)throw Error(await r.text());return r.json()}
  async function send(path,options){const r=await fetch(api+path,options);if(!r.ok)throw Error(await r.text());return r.json()}
  function drawChart(points){const c=$('chart'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#d9e2ec';ctx.lineWidth=1;for(let i=1;i<6;i++){const y=i*h/6;ctx.beginPath();ctx.moveTo(48,y);ctx.lineTo(w-15,y);ctx.stroke()}const p=points.filter(x=>x.value!==null);if(!p.length){ctx.fillStyle='#65758b';ctx.font='14px system-ui';ctx.fillText('暂无趋势数据',48,36);return}const v=p.map(x=>Number(x.value)),min=Math.min(...v),max=Math.max(...v),span=max===min?1:max-min;ctx.strokeStyle='#1d8a78';ctx.lineWidth=3;ctx.beginPath();p.forEach((x,i)=>{const px=48+i*(w-70)/Math.max(p.length-1,1),py=h-25-(x.value-min)/span*(h-55);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillStyle='#65758b';ctx.font='12px system-ui';ctx.fillText(max.toFixed(2),6,18);ctx.fillText(min.toFixed(2),6,h-12)}
  function renderCards(rows){$('cards').innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="section-title"><h3>${esc(x.device_id)} · ${esc(x.room)}</h3><span class="status">${esc(x.flag)}</span></div><div class="metric">${esc(x.aq_index)}</div><div class="meta">空气指数</div><p class="meta">温度：${esc(x.temp)} °C<br>湿度：${esc(x.humi)} %RH<br>原始ADC：${esc(x.aq_raw)}<br>上报：${x.ts?new Date(x.ts*1000).toLocaleString():'--'}</p></article>`).join(''):'<p class="empty">等待设备上报数据</p>'}
  function renderDevices(rows){$('devices').innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.device_id)}</td><td>${esc(x.room)}</td><td><span class="status ${x.online?'':'offline'}">${x.online?'在线':'离线'}</span></td><td>${x.last_seen?new Date(x.last_seen*1000).toLocaleString():'--'}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">暂无设备</td></tr>'}
  function renderAlarms(rows){$('alarms').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>时间</th><th>设备</th><th>指标</th><th>级别</th><th>数值</th><th>状态</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${new Date(a.ts*1000).toLocaleString()}</td><td>${esc(a.device_id)}</td><td>${esc(a.metric)}</td><td class="${a.level==='L3'?'alarm-high':'alarm-mid'}">${esc(a.level)}</td><td>${esc(a.value)}</td><td>${a.acked?'已确认':`<button class="danger" onclick="ack(${a.id})">确认</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<span class="empty">暂无告警</span>'}
  async function refresh(){try{const health=await get('/api/health');$('health').textContent=health.mqtt?'API正常 · MQTT已连接':'API正常 · 本地模式';const [latest,devices,alarms]=await Promise.all([get('/api/latest'),get('/api/devices'),get('/api/alarms?limit=30')]);renderCards(latest);renderDevices(devices);const old=$('device').value,all=[...new Set(devices.map(x=>x.device_id))];$('device').innerHTML='<option value="">请选择设备</option>'+all.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('device').value=all.includes(old)?old:(all[0]||'');renderAlarms(alarms);await refreshChart()}catch(e){$('health').textContent='连接失败';console.error(e)}}
  async function refreshChart(){const id=$('device').value;if(!id){drawChart([]);$('chartLabel').textContent='请选择设备';return}const q=`/api/history?device_id=${encodeURIComponent(id)}&metric=${$('metric').value}&bucket=${$('bucket').value}`;const rows=await get(q);drawChart(rows);$('chartLabel').textContent=`${id} · ${$('metric').selectedOptions[0].textContent}`}
  async function loadThreshold(){const id=$('device').value;if(!id)return;const rows=await get(`/api/thresholds?device_id=${encodeURIComponent(id)}`),row=rows.find(x=>x.metric===$('thresholdMetric').value);$('warnHi').value=row?.warn_hi??'';$('alertHi').value=row?.alert_hi??''}
  async function saveThreshold(){const id=$('device').value;if(!id){alert('请先选择设备');return}await send('/api/threshold',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:id,metric:$('thresholdMetric').value,warn_hi:Number($('warnHi').value)||null,alert_hi:Number($('alertHi').value)||null})});alert('阈值已保存');}
  async function ack(id){await send(`/api/alarms/${id}/ack`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acked_by:'web-user'})});await refresh()}
  $('refresh').onclick=refresh;$('refreshAlarms').onclick=refresh;$('device').onchange=()=>{refreshChart();loadThreshold()};$('metric').onchange=refreshChart;$('bucket').onchange=refreshChart;$('toggleSettings').onclick=()=>{$('settings').hidden=!$('settings').hidden;loadThreshold()};$('thresholdMetric').onchange=loadThreshold;$('saveThreshold').onclick=saveThreshold;refresh();setInterval(refresh,5000);
</script>
</body>
</html>
